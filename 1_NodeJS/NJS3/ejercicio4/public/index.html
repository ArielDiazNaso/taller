<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación de Atributos - Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Gestor Dinámico de Nodos</h1>
            <p class="lead">Crea enlaces y modifica sus atributos en tiempo real</p>
        </header>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Panel de Control</h5>
                        <div class="d-grid gap-2">
                            <button class="btn btn-dark" onclick="crearNodos()">1. Crear 5 Nodos (Enlaces)</button>
                            <button class="btn btn-primary" onclick="modificarAtributos()">2. Modificar Atributos</button>
                            <button class="btn btn-outline-danger btn-sm mt-3" onclick="resetear()">Resetear Proyecto</button>
                        </div>
                    </div>
                </div>

                <div class="card shadow border-0 mt-4 bg-dark text-white">
                    <div class="card-body">
                        <h5 class="card-title text-info">Monitor de Cambios</h5>
                        <div id="monitor-log" class="small font-monospace" style="height: 150px; overflow-y: auto;">
                            Esperando acciones...
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow border-0" style="min-height: 400px;">
                    <div class="card-header bg-white fw-bold">Nodos Generados</div>
                    <div class="card-body d-flex flex-column gap-3" id="contenedor-nodos">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/manipulacion.js"></script>
</body>
</html>
