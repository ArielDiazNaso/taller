<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructor InnerHTML - Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-dark">Generador de Objetos <span class="text-primary">innerHTML</span></h1>
            <p class="text-muted">Inyecta componentes complejos directamente desde el servidor/cliente</p>
        </header>

        <div class="row">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-primary text-white fw-bold">Caja de Herramientas</div>
                    <div class="card-body">
                        <div class="d-grid gap-3">
                            <button class="btn btn-outline-primary" onclick="inyectarAlerta()">Inyectar Alerta</button>
                            <button class="btn btn-outline-success" onclick="inyectarTarjeta()">Inyectar Tarjeta de Perfil</button>
                            <button class="btn btn-outline-info" onclick="inyectarLista()">Inyectar Lista de Tareas</button>
                            <button class="btn btn-outline-warning" onclick="inyectarVideo()">Inyectar Reproductor Video</button>
                            <button class="btn btn-outline-danger" onclick="inyectarMétricas()">Inyectar Panel Métricas</button>                            <hr>
                            <button class="btn btn-dark btn-sm" onclick="limpiarPanel()">Limpiar Todo</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Escenario de Renderizado</span>
                        <span class="badge bg-secondary" id="contador-objetos">Objetos: 0</span>
                    </div>
                    <div class="card-body" id="escenario" style="min-height: 500px; background-color: #fcfcfc;">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/constructor.js"></script>
</body>
</html>
