<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Seguro - Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 class="mb-0">Formulario de Registro Validado</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="formulario-registro" novalidate>
                            <div class="mb-3">
                                <label class="form-label">Nombre Completo:</label>
                                <input type="text" id="nombre" class="form-control" 
                                       placeholder="Ej: Ariel" required
                                       pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚ\s]{2,}$">
                                <div class="invalid-feedback">Mínimo 2 caracteres, solo letras.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico:</label>
                                <input type="email" id="correo" class="form-control" 
                                       placeholder="usuario@dominio.com" required>
                                <div class="invalid-feedback">Ingresa un correo válido con @ y dominio.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Edad:</label>
                                <input type="number" id="edad" class="form-control" min="18" max="99" required>
                                <div class="invalid-feedback">Debes ser mayor de 18 años.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">País de Residencia:</label>
                                <select id="pais" class="form-select" required>
                                    <option value="">Selecciona uno...</option>
                                    <option value="Argentina">Argentina</option>
                                    <option value="Uruguay">Uruguay</option>
                                    <option value="Chile">Chile</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Género:</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" value="Masculino" required>
                                    <label class="form-check-label">Masculino</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genero" value="Femenino">
                                    <label class="form-check-label">Femenino</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terminos" required>
                                    <label class="form-check-label">Acepto los términos y condiciones</label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 fw-bold">REGISTRAR DATOS</button>
                        </form>
                    </div>
                </div>

                <div id="resultado-envio" class="mt-4 d-none">
                    <div class="alert alert-success shadow-sm">
                        <h5>✅ Datos Procesados con Éxito:</h5>
                        <div id="datos-inyectados" class="font-monospace small"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/validacion.js"></script>
</body>
</html>
