<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 1 - push()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método push()</h1>
        </header>

        <main>
            <!-- Ejercicio 1.1: Frutas -->
            <section class="card">
                <h2>1. Agregar 3 frutas</h2>
                <div class="controls">
                    <button id="botonAgregarFrutas">Agregar Manzana, Pera, Banana</button>
                </div>
                <div class="result-box">
                    <strong>Array de Frutas:</strong>
                    <p id="resultadoFrutas">[]</p>
                </div>
            </section>

            <!-- Ejercicio 1.2: Amigos -->
            <section class="card">
                <h2>2. Agregar 3 amigos</h2>
                <div class="controls">
                    <input type="text" id="nombreAmigo" placeholder="Nombre del amigo">
                    <button id="botonAgregarAmigo">Agregar Amigo</button>
                </div>
                <div class="result-box">
                    <strong>Lista de Amigos:</strong>
                    <p id="resultadoAmigos">[]</p>
                </div>
            </section>

            <!-- Ejercicio 1.3: Números condicionales -->
            <section class="card">
                <h2>3. Agregar si es mayor al último</h2>
                <div class="controls">
                    <input type="number" id="entradaNumero" placeholder="Ingresa un número">
                    <button id="botonAgregarNumero">Agregar si es mayor</button>
                </div>
                <div class="result-box">
                    <strong>Array de Números:</strong>
                    <p id="resultadoNumeros">[10]</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
