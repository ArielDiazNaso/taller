<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 10 - map()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método map()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Multiplicar por 3</h2>
                <div class="controls">
                    <button id="botonMultiplicar">Multiplicar</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> [1, 2, 3, 4, 5] <br>
                    <strong>Nuevo Array:</strong> <p id="resultadoMultiplicar">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Nombres a Mayúsculas</h2>
                <div class="controls">
                    <button id="botonMayusculas">Convertir</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> ["juan", "maria", "pedro"] <br>
                    <strong>Nuevo Array:</strong> <p id="resultadoMayusculas">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Precios con IVA (21%)</h2>
                <div class="controls">
                    <button id="botonCalcularIva">Calcular IVA</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> [100, 200, 500] <br>
                    <strong>Con IVA:</strong> <p id="resultadoIva">[]</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
