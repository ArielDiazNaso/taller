<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 12 - reduce()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método reduce()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Sumar todos los elementos</h2>
                <div class="controls">
                    <button id="botonSumar">Sumar</button>
                </div>
                <div class="result-box">
                    <strong>Array:</strong> [1, 2, 3, 4, 5] <br>
                    <strong>Suma:</strong> <p id="resultadoSuma">0</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Multiplicar todos los elementos</h2>
                <div class="controls">
                    <button id="botonMultiplicar">Multiplicar</button>
                </div>
                <div class="result-box">
                    <strong>Array:</strong> [1, 2, 3, 4, 5] <br>
                    <strong>Producto:</strong> <p id="resultadoProducto">0</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Suma total de precios</h2>
                <div class="controls">
                    <button id="botonCalcularTotal">Calcular Total</button>
                </div>
                <div class="result-box">
                    <strong>Lista de Productos:</strong>
                    <p id="listaProductos">-</p>
                    <hr>
                    <strong>Total:</strong> <p id="resultadoTotal">0</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
