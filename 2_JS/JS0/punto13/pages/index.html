<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 13 - sort()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método sort()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Ordenar números (menor a mayor)</h2>
                <div class="controls">
                    <button id="botonOrdenarNumeros">Ordenar</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> [40, 100, 1, 5, 25, 10] <br>
                    <strong>Ordenado:</strong> <p id="resultadoNumeros">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Ordenar palabras alfabéticamente</h2>
                <div class="controls">
                    <button id="botonOrdenarPalabras">Ordenar</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> ["Zapato", "Arbol", "Casa", "Bala"] <br>
                    <strong>Ordenado:</strong> <p id="resultadoPalabras">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Ordenar por edad</h2>
                <div class="controls">
                    <button id="botonOrdenarEdad">Ordenar por Edad</button>
                </div>
                <div class="result-box">
                    <strong>Lista de Personas:</strong>
                    <p id="listaPersonas">-</p>
                    <hr>
                    <strong>Ordenados:</strong>
                    <p id="resultadoEdad">[]</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
