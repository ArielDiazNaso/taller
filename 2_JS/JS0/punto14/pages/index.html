<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 14 - reverse()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método reverse()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Invertir array de letras</h2>
                <div class="controls">
                    <button id="botonInvertirLetras">Invertir</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> ["A", "B", "C", "D"] <br>
                    <strong>Invertido:</strong> <p id="resultadoLetras">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Invertir orden de números</h2>
                <div class="controls">
                    <button id="botonInvertirNumeros">Invertir</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> [1, 2, 3, 4, 5] <br>
                    <strong>Invertido:</strong> <p id="resultadoNumeros">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Invertir texto (String to Array)</h2>
                <div class="controls">
                    <input type="text" id="entradaTexto" placeholder="Ingresa un texto">
                    <button id="botonInvertirTexto">Invertir</button>
                </div>
                <div class="result-box">
                    <strong>Resultado:</strong> <p id="resultadoTexto">-</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
