<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 2 - pop()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método pop()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Eliminar último animal</h2>
                <div class="controls">
                    <button id="botonEliminarAnimal">Eliminar Último</button>
                </div>
                <div class="result-box">
                    <strong>Animales:</strong>
                    <p id="resultadoAnimales">["León", "Tigre", "Oso"]</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Lista de compras</h2>
                <div class="controls">
                    <button id="botonEliminarProducto">Eliminar Último Producto</button>
                </div>
                <div class="result-box">
                    <strong>Productos:</strong>
                    <p id="resultadoProductos">["Pan", "Leche", "Huevos"]</p>
                    <strong>Eliminado:</strong>
                    <p id="productoEliminado">-</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Vaciar array con While</h2>
                <div class="controls">
                    <button id="botonVaciarArray">Vaciar Array</button>
                </div>
                <div class="result-box">
                    <strong>Estado del Array:</strong>
                    <p id="resultadoVaciado">[1, 2, 3, 4, 5]</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
