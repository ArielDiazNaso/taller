<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 3 - unshift()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método unshift()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Agregar 3 colores al inicio</h2>
                <div class="controls">
                    <button id="botonAgregarColores">Agregar Rojo, Verde, Azul</button>
                </div>
                <div class="result-box">
                    <strong>Colores:</strong>
                    <p id="resultadoColores">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Tarea urgente</h2>
                <div class="controls">
                    <input type="text" id="entradaTarea" placeholder="Nueva tarea urgente">
                    <button id="botonAgregarTarea">Agregar al Inicio</button>
                </div>
                <div class="result-box">
                    <strong>Tareas:</strong>
                    <p id="resultadoTareas">["Lavar platos", "Estudiar"]</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Usuario conectado</h2>
                <div class="controls">
                    <input type="text" id="entradaUsuario" placeholder="Nuevo usuario">
                    <button id="botonAgregarUsuario">Insertar al Inicio</button>
                </div>
                <div class="result-box">
                    <strong>Usuarios:</strong>
                    <p id="resultadoUsuarios">["Yo", "El"]</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
