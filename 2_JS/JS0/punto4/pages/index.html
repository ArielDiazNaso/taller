<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 4 - shift()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método shift()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Eliminar primer número</h2>
                <div class="controls">
                    <button id="botonEliminarNumero">Eliminar Primero</button>
                </div>
                <div class="result-box">
                    <strong>Números:</strong>
                    <p id="resultadoNumeros">[1, 2, 3, 4, 5]</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Eliminar primer mensaje</h2>
                <div class="controls">
                    <button id="botonEliminarMensaje">Eliminar Primero</button>
                </div>
                <div class="result-box">
                    <strong>Mensajes:</strong>
                    <p id="resultadoMensajes">["Hola", "Cómo estás?", "Adiós"]</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Cola de atención al cliente</h2>
                <div class="controls">
                    <button id="botonAtenderSiguiente">Atender Siguiente</button>
                </div>
                <div class="result-box">
                    <strong>Cola de espera:</strong>
                    <p id="resultadoCola">["Cliente A", "Cliente B", "Cliente C"]</p>
                    <strong>Atendiendo a:</strong>
                    <p id="atendiendoA">-</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
