<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 6 - slice()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método slice()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Copiar primeros 3 elementos</h2>
                <div class="controls">
                    <button id="botonCopiarPrimeros3">Copiar</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> [10, 20, 30, 40, 50] <br>
                    <strong>Copia:</strong> <p id="resultadoPrimeros3">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Copiar películas pos 2 a 4</h2>
                <div class="controls">
                    <button id="botonCopiarPeliculas">Copiar 2-4</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> ["M1", "M2", "M3", "M4", "M5"] <br>
                    <strong>Copia:</strong> <p id="resultadoPeliculas">[]</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Copiar últimos 3 elementos</h2>
                <div class="controls">
                    <button id="botonCopiarUltimos3">Copiar últimos 3</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> ["A", "B", "C", "D", "E"] <br>
                    <strong>Copia:</strong> <p id="resultadoUltimos3">[]</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
