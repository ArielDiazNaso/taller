<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 7 - indexOf()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método indexOf()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Posición de "perro"</h2>
                <div class="controls">
                    <button id="botonBuscarPerro">Buscar "perro"</button>
                </div>
                <div class="result-box">
                    <strong>Array:</strong> ["gato", "perro", "pájaro"] <br>
                    <strong>Posición:</strong> <p id="resultadoPerro">-</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Buscar número 50</h2>
                <div class="controls">
                    <button id="botonBuscar50">Buscar 50</button>
                </div>
                <div class="result-box">
                    <strong>Array:</strong> [10, 30, 50, 70] <br>
                    <strong>Posición:</strong> <p id="resultado50">-</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Buscar ciudad "Madrid"</h2>
                <div class="controls">
                    <button id="botonAgregarMadrid">Agregar "Madrid"</button>
                    <button id="botonBuscarMadrid">Buscar "Madrid"</button>
                </div>
                <div class="result-box">
                    <strong>Array:</strong> <span id="listaCiudades">["Paris", "Berlin", "Tokyo"]</span> <br>
                    <strong>Resultado:</strong> <p id="resultadoMadrid">-</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
