<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 9 - forEach()</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Método forEach()</h1>
        </header>
        <main>
            <section class="card">
                <h2>1. Saludar a todos</h2>
                <div class="controls">
                    <button id="botonSaludar">Saludar</button>
                </div>
                <div class="result-box">
                    <strong>Salidas:</strong>
                    <p id="resultadoSaludos">-</p>
                </div>
            </section>
            <section class="card">
                <h2>2. Doble de cada número</h2>
                <div class="controls">
                    <button id="botonCalcularDobles">Calcular Dobles</button>
                </div>
                <div class="result-box">
                    <strong>Original:</strong> [2, 4, 6] <br>
                    <strong>Dobles:</strong> <p id="resultadoDobles">-</p>
                </div>
            </section>
            <section class="card">
                <h2>3. Mostrar Nombre y Edad</h2>
                <div class="controls">
                    <button id="botonMostrarUsuarios">Mostrar Usuarios</button>
                </div>
                <div class="result-box">
                    <strong>Usuarios:</strong>
                    <p id="resultadoUsuarios">-</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../scripts/main.js"></script>
</body>
</html>
