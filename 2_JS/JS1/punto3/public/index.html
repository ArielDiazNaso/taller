<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias Elite - Registro de Miembros</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Playfair Display & Merriweather -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-3 fw-bold title-elite">Registro de Miembros Ilustres</h1>
            <p class="lead subtitle-elite">Portal de Noticias Elite — Una Herencia de Verdad y Prestigio</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Tarjeta de Registro -->
                <div class="card card-elite border-0 shadow-sm mb-5">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">Solicitud de Ingreso</h2>
                        
                        <!-- Contenedor de Alertas -->
                        <div id="alertContainer"></div>

                        <form id="formularioRegistro" novalidate>
                            <div class="row g-4">
                                <!-- Nombre -->
                                <div class="col-md-6">
                                    <div class="form-floating-elite">
                                        <input type="text" class="form-control-elite" id="nombre" name="nombre" placeholder="Nombre" required>
                                        <label for="nombre">Nombre</label>
                                        <div class="invalid-feedback-custom" id="error-nombre"></div>
                                    </div>
                                </div>
                                <!-- Apellido -->
                                <div class="col-md-6">
                                    <div class="form-floating-elite">
                                        <input type="text" class="form-control-elite" id="apellido" name="apellido" placeholder="Apellido" required>
                                        <label for="apellido">Apellido</label>
                                        <div class="invalid-feedback-custom" id="error-apellido"></div>
                                    </div>
                                </div>
                                <!-- Edad -->
                                <div class="col-md-4">
                                    <div class="form-floating-elite">
                                        <input type="number" class="form-control-elite" id="edad" name="edad" placeholder="Edad" required>
                                        <label for="edad">Edad</label>
                                        <div class="invalid-feedback-custom" id="error-edad"></div>
                                    </div>
                                </div>
                                <!-- Fecha de Nacimiento -->
                                <div class="col-md-8">
                                    <div class="form-floating-elite">
                                        <input type="date" class="form-control-elite" id="fechaNacimiento" name="fechaNacimiento" required>
                                        <label for="fechaNacimiento">Fecha de Nacimiento</label>
                                        <div class="invalid-feedback-custom" id="error-fechaNacimiento"></div>
                                    </div>
                                </div>
                                <!-- Sexo -->
                                <div class="col-md-6">
                                    <div class="form-floating-elite">
                                        <select class="form-select-elite" id="sexo" name="sexo" required>
                                            <option value="" disabled selected>Seleccione Sexo</option>
                                            <option value="Masculino">Masculino</option>
                                            <option value="Femenino">Femenino</option>
                                        </select>
                                        <label for="sexo">Sexo</label>
                                        <div class="invalid-feedback-custom" id="error-sexo"></div>
                                    </div>
                                </div>
                                <!-- Documento -->
                                <div class="col-md-6">
                                    <div class="form-floating-elite">
                                        <input type="text" class="form-control-elite" id="documento" name="documento" placeholder="Documento / Pasaporte" required>
                                        <label for="documento">Documento de Identidad</label>
                                        <div class="invalid-feedback-custom" id="error-documento"></div>
                                    </div>
                                </div>
                                <!-- Estado Civil -->
                                <div class="col-md-6">
                                    <div class="form-floating-elite">
                                        <select class="form-select-elite" id="estadoCivil" name="estadoCivil" required>
                                            <option value="" disabled selected>Estado Civil</option>
                                            <option value="Soltero/a">Soltero/a</option>
                                            <option value="Casado/a">Casado/a</option>
                                            <option value="Divorciado/a">Divorciado/a</option>
                                            <option value="Viudo/a">Viudo/a</option>
                                        </select>
                                        <label for="estadoCivil">Estado Civil</label>
                                        <div class="invalid-feedback-custom" id="error-estadoCivil"></div>
                                    </div>
                                </div>
                                <!-- Nacionalidad -->
                                <div class="col-md-6">
                                    <div class="form-floating-elite">
                                        <input type="text" class="form-control-elite" id="nacionalidad" name="nacionalidad" placeholder="Nacionalidad" required>
                                        <label for="nacionalidad">Nacionalidad</label>
                                        <div class="invalid-feedback-custom" id="error-nacionalidad"></div>
                                    </div>
                                </div>
                                <!-- Teléfono -->
                                <div class="col-md-6">
                                    <div class="form-floating-elite">
                                        <input type="tel" class="form-control-elite" id="telefono" name="telefono" placeholder="Teléfono" required>
                                        <label for="telefono">Teléfono</label>
                                        <div class="invalid-feedback-custom" id="error-telefono"></div>
                                    </div>
                                </div>
                                <!-- Mail -->
                                <div class="col-md-6">
                                    <div class="form-floating-elite">
                                        <input type="email" class="form-control-elite" id="mail" name="mail" placeholder="Mail" required>
                                        <label for="mail">Mail</label>
                                        <div class="invalid-feedback-custom" id="error-mail"></div>
                                    </div>
                                </div>
                                <!-- Hijos (Condicional) -->
                                <div class="col-md-12">
                                    <div class="form-group-elite">
                                        <label class="d-block mb-2 label-elite">¿Tiene hijos?</label>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input-elite" type="radio" name="tieneHijos" id="hijosSi" value="si">
                                            <label class="form-check-label" for="hijosSi">Sí</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input-elite" type="radio" name="tieneHijos" id="hijosNo" value="no" checked>
                                            <label class="form-check-label" for="hijosNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <!-- Cantidad de Hijos (Oculto inicialmente) -->
                                <div class="col-md-6 d-none" id="contenedorCantidadHijos">
                                    <div class="form-floating-elite">
                                        <input type="number" class="form-control-elite" id="cantidadHijos" name="cantidadHijos" placeholder="¿Cuántos hijos tiene?" value="0">
                                        <label for="cantidadHijos">¿Cuántos hijos tiene?</label>
                                        <div class="invalid-feedback-custom" id="error-cantidadHijos"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="text-center mt-5">
                                <button type="submit" class="btn btn-elite px-5 py-3">Registrar Membresía</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Directorio de Miembros -->
                <div class="directory-section">
                    <h2 class="text-center mb-4 title-elite">Directorio de Miembros</h2>
                    <div class="row g-4" id="directorioMiembros">
                        <!-- Las tarjetas de miembros se insertarán aquí dinámicamente -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
