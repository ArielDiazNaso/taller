<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Académica</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar Responsive -->
    <nav class="navbar navbar-expand-lg barra-navegacion fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">AcademiaPro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                </ul>
                <!-- Switch de Modo Oscuro en Navbar -->
                <div class="d-flex align-items-center ms-lg-3">
                    <label class="form-check-label small text-muted me-2" for="checkModoOscuro">Modo Oscuro</label>
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="checkModoOscuro">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="contenedor-principal">
        <div class="tarjeta-minimalista">
            <div class="encabezado-tarjeta">
                <h2 class="mb-0 fw-normal">Registro de Calificaciones</h2>
            </div>
            
            <div class="cuerpo-tarjeta">
                <div class="row g-5">
                    <!-- Columna Izquierda: Datos del Estudiante -->
                    <div class="col-lg-5">
                        <span class="seccion-titulo">Datos del Estudiante</span>
                        <div class="mb-4">
                            <label for="nombreEstudiante" class="form-label small text-muted">Nombre Completo</label>
                            <input type="text" class="form-control form-control-lg" id="nombreEstudiante" placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="mb-5">
                            <label for="dniEstudiante" class="form-label small text-muted">Documento (DNI)</label>
                            <input type="text" class="form-control form-control-lg" id="dniEstudiante" placeholder="Ej. 12345678" maxlength="15">
                        </div>
                        
                        <div class="d-grid gap-3">
                            <button id="botonDescargar" class="btn btn-primary btn-lg shadow-sm">
                                Finalizar y Guardar
                            </button>
                            <p class="text-center text-muted small mt-2">
                                Se descargará una copia local y se guardará en el servidor.
                            </p>
                        </div>
                    </div>

                    <!-- Columna Derecha: Gestión de Notas -->
                    <div class="col-lg-7 border-start ps-lg-5">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="seccion-titulo mb-0">Listado de Notas</span>
                            <div class="btn-group">
                                <button id="botonAgregarNota" class="btn btn-outline-secondary btn-sm">
                                    + Añadir
                                </button>
                                <button id="botonQuitarNota" class="btn btn-outline-secondary btn-sm">
                                    - Quitar
                                </button>
                            </div>
                        </div>
                        
                        <div id="listaNotas" class="contenedor-notas row g-3">
                            <!-- Los campos de notas se inyectan dinámicamente -->
                        </div>
                        
                        <div class="mt-4 p-3 bg-light rounded small text-muted">
                            <i class="bi bi-info-circle"></i> Use valores enteros entre 0 y 1000.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Notificaciones -->
    <div class="modal fade" id="modalNotificacion" tabindex="-1" aria-labelledby="modalNotificacionLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-light border-0">
                    <h5 class="modal-title fw-bold" id="modalNotificacionLabel">Aviso del Sistema</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4 text-center">
                    <p id="mensajeModal" class="mb-0 fs-5"></p>
                </div>
                <div class="modal-footer border-0 justify-content-center pb-4">
                    <button type="button" class="btn btn-primary px-5" data-bs-dismiss="modal">Entendido</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Personalizado -->
    <script src="script.js"></script>
</body>
</html>
