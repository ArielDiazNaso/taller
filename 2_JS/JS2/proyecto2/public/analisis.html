<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Datos Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #212529;
            --border-color: #dee2e6;
            --bg-nav: rgba(255, 255, 255, 0.9);
            --text-nav: #212529;
        }

        [data-tema="dark"] {
            --bg-body: #212529;
            --bg-card: #2b3035;
            --text-main: #f8f9fa;
            --border-color: #495057;
            --bg-nav: rgba(33, 37, 41, 0.9);
            --text-nav: #f8f9fa;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding-bottom: 50px;
        }

        .navbar {
            backdrop-filter: blur(10px);
            background-color: var(--bg-nav) !important;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease;
        }

        .navbar-brand, .nav-link {
            color: var(--text-nav) !important;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 25px;
        }

        .zona-drop {
            border: 3px dashed var(--border-color);
            border-radius: 15px;
            padding: 50px;
            text-align: center;
            background-color: var(--bg-card);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .zona-drop.dragover {
            border-color: #0d6efd;
            background-color: rgba(13, 110, 253, 0.05);
            transform: scale(1.01);
        }

        .card {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .card-stats {
            border-left: 5px solid #0d6efd;
            transition: transform 0.2s;
        }

        .card-stats:hover {
            transform: translateY(-5px);
        }

        .tabla-contenedor {
            max-height: 400px;
            overflow-y: auto;
        }

        .form-check-input {
            cursor: pointer;
        }
    </style>
</head>
<body data-tema="light">

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <span class="navbar-brand d-flex align-items-center fw-bold text-uppercase tracking-wider">
                <i class="bi bi-graph-up-arrow me-2 text-primary"></i>
                Analizador de Datos
            </span>
            
            <div class="d-flex align-items-center">
                <div class="form-check form-switch me-2">
                    <i class="bi bi-sun-fill text-warning me-2"></i>
                    <input class="form-check-input" type="checkbox" id="switchTema">
                    <i class="bi bi-moon-stars-fill text-info ms-1"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="row">
            <!-- Zona de Carga Drag & Drop -->
            <div class="col-12 mb-5">
                <div id="zonaDrop" class="zona-drop shadow-lg">
                    <div class="mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-cloud-arrow-up text-primary" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708z"/>
                            <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383m.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
                        </svg>
                    </div>
                    <h4 class="fw-bold">Arrastra tu reporte .txt aquí</h4>
                    <p class="text-muted">O haz clic para seleccionar el archivo manualmente</p>
                    <p class="text-danger small mb-0 fw-bold"><i class="bi bi-exclamation-triangle"></i> Máximo 2MB</p>
                    <input type="file" id="inputManual" hidden accept=".txt">
                </div>
            </div>

            <!-- Dashboard de Analítica -->
            <div id="seccionDashboard" class="col-12" style="display: none;">
                <div class="row g-5">
                    <!-- Tarjetas de Estadísticas -->
                    <div class="col-md-4">
                        <div class="card card-stats shadow-sm mb-4">
                            <div class="card-body py-4">
                                <h6 class="text-uppercase text-muted small fw-bold">Números Útiles</h6>
                                <h2 id="numUtiles" class="mb-0 text-primary display-6 fw-bold">0</h2>
                            </div>
                        </div>
                        <div class="card card-stats shadow-sm mb-4" style="border-left-color: #dc3545;">
                            <div class="card-body py-4">
                                <h6 class="text-uppercase text-muted small fw-bold">Números No Útiles</h6>
                                <h2 id="numNoUtiles" class="mb-0 text-danger display-6 fw-bold">0</h2>
                            </div>
                        </div>
                        <div class="card card-stats shadow-sm mb-4" style="border-left-color: #ffc107;">
                            <div class="card-body py-4">
                                <h6 class="text-uppercase text-muted small fw-bold">Porcentaje de Utilidad</h6>
                                <h2 id="porcentajeAnalisis" class="mb-0 text-warning display-6 fw-bold">0%</h2>
                            </div>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button id="btnExportar" class="btn btn-primary btn-lg fw-bold shadow">
                                <i class="bi bi-download me-2"></i> EXPORTAR ANÁLISIS
                            </button>
                        </div>
                    </div>

                    <!-- Tabla de Resultados -->
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-transparent py-4 border-0">
                                <h5 class="mb-0 fw-bold"><i class="bi bi-list-check me-2"></i> Resultados Filtrados</h5>
                                <p class="text-muted small mb-0">Orden ascendente por valor entero</p>
                            </div>
                            <div class="card-body pt-0">
                                <div class="tabla-contenedor">
                                    <table class="table table-hover align-middle">
                                        <thead>
                                            <tr class="text-muted small text-uppercase">
                                                <th>POS</th>
                                                <th>ETIQUETA</th>
                                                <th>VALOR ENTERO</th>
                                                <th>ESTADO</th>
                                            </tr>
                                        </thead>
                                        <tbody id="cuerpoResultados">
                                            <!-- Inyectado por JS -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="analisis.js"></script>
</body>
</html>
