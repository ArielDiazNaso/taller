<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html {
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="text-primary mb-0">Directorio de Usuarios</h1>
            <button id="themeToggle" class="btn btn-outline-secondary">
                <span id="themeIcon">🌙</span> Modo Oscuro
            </button>
        </div>
        <div id="users-container" class="row g-4"></div>
        <div id="error-message" class="alert alert-danger d-none mt-4" role="alert"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Manejo del modo claro/oscuro
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function toggleTheme() {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            if (currentTheme === 'light') {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                themeToggle.innerHTML = '<span id="themeIcon">☀️</span> Modo Claro';
            } else {
                htmlElement.setAttribute('data-bs-theme', 'light');
                themeToggle.innerHTML = '<span id="themeIcon">🌙</span> Modo Oscuro';
            }
        }

        themeToggle.addEventListener('click', toggleTheme);
    </script>
    <script src="script.js"></script>
</body>
</html>
