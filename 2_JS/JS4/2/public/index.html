<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html {
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-end mb-4">
            <button id="themeToggle" class="btn btn-outline-secondary">
                <span id="themeIcon">🌙</span> Modo Oscuro
            </button>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4">Información del Usuario</h2>
                        
                        <form id="userForm">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Enviar</button>
                        </form>

                        <!-- Success message container -->
                        <div id="successMessage" class="mt-4 d-none">
                            <div class="alert alert-success text-center" role="alert">
                                <h4 class="alert-heading">¡Envío Exitoso!</h4>
                                <p class="mb-0">Tu ID único: <span id="userId" class="fw-bold fs-5"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Manejo del modo claro/oscuro
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function toggleTheme() {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            if (currentTheme === 'light') {
                htmlElement.setAttribute('data-bs-theme', 'dark');
                themeToggle.innerHTML = '<span id="themeIcon">☀️</span> Modo Claro';
            } else {
                htmlElement.setAttribute('data-bs-theme', 'light');
                themeToggle.innerHTML = '<span id="themeIcon">🌙</span> Modo Oscuro';
            }
        }

        themeToggle.addEventListener('click', toggleTheme);
    </script>
    <script src="script.js"></script>
</body>
</html>
