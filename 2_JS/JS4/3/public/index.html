<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Filter App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>User Directory</h1>
            <button id="themeToggle" class="btn btn-outline-secondary">
                <span id="themeIcon">🌙</span> Dark Mode
            </button>
        </div>

        <div class="mb-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by name...">
        </div>

        <div id="usersContainer" class="row g-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        const searchInput = document.getElementById('searchInput');

        async function initApp() {
            try {
                const users = await fetchUsers();
                renderUsers(users);
            } catch (error) {
                showError('Failed to load users. Please try again later.');
            }
        }

        searchInput.addEventListener('input', () => {
            const filteredUsers = filterUsers(searchInput.value);
            renderUsers(filteredUsers);
        });

        initApp();
    </script>
</body>
</html>
